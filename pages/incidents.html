<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>Incidents</title>
        <link rel="stylesheet" href="../css/style.css"/>
    </head>
    <body>
        <main class="container">
            <h1>Incidents</h1>
            <div class="card no-print">
                <h2>Report incident</h2>
                <div class="row">
                    <div><label>Site</label><select><option>Demo Mall</option><option>Demo Warehouse</option></select></div>
                    <div><label>Type</label><select><option>Theft</option><option>Trespass</option><option>Equipment</option></select></div>
                </div>
                <label>Description</label>
                <textarea rows="3"></textarea>
                <br/><br/>
                <button>Submit report</button>
            </div>
            <div class="card">
                <h2>Incident log</h2>
                <div class="table-wrap">
                    <table>
                    <tr><th>Time</th><th>Site</th><th>Type</th><th>Status</th></tr>
                    <tr><td>Mon 09:40</td><td>Demo Mall</td><td>Trespass</td><td><span class="badge warn">Under review</span></td></tr>
                    <tr><td>Sun 23:10</td><td>Demo Warehouse</td><td>Equipment</td><td><span class="badge ok">Resolved</span></td></tr>
                    </table>
                </div>
            </div>
        </main>
       <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
        <script src="../js/supabaseClient.js"></script>
        <script src="../js/layout.js"></script>
    </body>
</html>
