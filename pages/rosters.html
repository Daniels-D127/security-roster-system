<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>Rosters</title>
        <link rel="stylesheet" href="../css/style.css"/>
    </head>
    <body>
        <main class="container">
            <h1>Rosters</h1>
            <div class="card no-print">
                <h2>Create shifts</h2>
                <div class="row">
                    <div><label>site</label><select><option>Demo Mall</option><option>Demo Warehouse</option></select></div>
                    <div><label>Start</label><input type="datetime-local"/></div>
                    <div><label>End</label><input type="datetime-local"/></div>
                    <div><label>Guard</label><select><option>Guard A</option><option>Guard B</option></select></div>
                </div>
                <button>Save shift</button>
            </div>
            <div class="card">
                <h2>Upcoming shifts</h2>
                <div class="table-wrap">
                    <table>
                        <tr><th>Site</th><th>Start</th><th>End</th><th>Guard</th><th>Coverage</th></tr>
                        <tr><td>Demo Mall</td><td>Mon 06:00</td><td>Mon 14:00</td><td>Guard A</td><td><span class="badge ok">Filled</span></td></tr>
                        <tr><td>Demo Warehouse</td><td>Mon 22:00</td><td>Tue 06:00</td><td>-</td><td><span class="badge bad">Unfilled</span></td></tr>
                    </table>
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
        <script src="../js/supabaseClient.js"></script>
        <script src="../js/layout.js"></script>
    </body>
</html>
